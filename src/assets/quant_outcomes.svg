<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica Neue, Inter, Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#0F172A">Hypothesis Outcomes</text>
  <text x="40" y="68" font-size="13" fill="#64748B">where every tested strategy has ended up so far</text>

  <line x1="40" y1="84" x2="600" y2="84" stroke="#E2E8F0" stroke-width="1"/>

  <!--
    Geometry: source bar x 170-180, y 110-330 (height 220).
      rejected share ~ 90%: y 110-308 ; advanced: y 308-330
    Target bars at x 400-410:
      rejected: y 104-284 ; advanced: y 304-344 (exaggerated for visibility)
  -->

  <path d="M 180 110 C 290 110, 290 104, 400 104 L 400 284 C 290 284, 290 308, 180 308 Z"
        fill="#94A3B8" opacity="0.55"/>
  <path d="M 180 308 C 290 308, 290 304, 400 304 L 400 344 C 290 344, 290 330, 180 330 Z"
        fill="#10B981" opacity="0.7"/>

  <rect x="170" y="110" width="10" height="220" fill="#2563EB"/>
  <rect x="400" y="104" width="10" height="180" fill="#94A3B8"/>
  <rect x="400" y="304" width="10" height="40" fill="#10B981"/>

  <text x="162" y="214" font-size="28" font-weight="700" fill="#0F172A" text-anchor="end">100+</text>
  <text x="162" y="234" font-size="12" fill="#64748B" text-anchor="end">strategies tested</text>

  <text x="420" y="186" font-size="20" font-weight="700" fill="#0F172A">nearly 90%</text>
  <text x="420" y="206" font-size="12" font-weight="600" fill="#1E293B">rejected</text>
  <text x="420" y="222" font-size="10" fill="#64748B">failed a pre-registered pass/fail rule</text>

  <text x="420" y="320" font-size="16" font-weight="700" fill="#10B981">the rest</text>
  <text x="420" y="338" font-size="12" font-weight="600" fill="#1E293B">advanced to paper or live tracking</text>

  <text x="320" y="386" font-size="10" fill="#94A3B8" text-anchor="middle">advancing means a candidate for further tracking, not a guarantee of forward performance</text>
</svg>
